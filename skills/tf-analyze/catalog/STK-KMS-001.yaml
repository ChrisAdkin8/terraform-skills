id: STK-KMS-001
title: "KMS crypto key missing rotation period"
section: stack
default_urgency: HIGH
blast_radius: single-resource
status: stub
cis:
  - "1.10"
patterns:
  - kind: resource_missing_arg
    resource: google_kms_crypto_key
    arg: rotation_period
recommendation: |
  Set `rotation_period = "7776000s"` (90 days) or shorter on every
  symmetric encryption key. Asymmetric keys are exempt — they cannot
  rotate without invalidating signatures.
verification: |
  `gcloud kms keys describe <key> --keyring <ring> --location <loc> --format='value(rotationPeriod)'`
  must return a value ≤ `7776000s`.
