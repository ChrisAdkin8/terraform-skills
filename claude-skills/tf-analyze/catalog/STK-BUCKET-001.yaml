id: STK-BUCKET-001
title: "GCS bucket missing versioning"
section: stack
default_urgency: HIGH
blast_radius: single-resource
status: stub
cis:
  - "5.3"
patterns:
  - kind: resource_missing_arg
    resource: google_storage_bucket
    nested_path: versioning.enabled
recommendation: |
  Add `versioning { enabled = true }`. Without object versioning, an
  accidental overwrite or `gsutil rm` is unrecoverable. Combine with a
  `lifecycle_rule` to expire non-current versions after N days.
verification: |
  `gcloud storage buckets describe gs://<name> --format='value(versioning.enabled)'`
  must return `True`.
